name: Skill tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test runner
        run: python -m pip install --upgrade pip pytest
      - name: Run v5.2 regression suite
        run: python -m pytest -q
      - name: Run pipeline wiring audit
        run: python scripts/audit_skill_pipeline.py --skill-root .
